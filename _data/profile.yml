short_bio_text_justify: false
short_bio: >-
  <p>
      Hello, I’m Sujin Joanna. I am an apparel designer with about a decade of industry experience and also a computer scientist. I’m currently pursuing a Ph.D. in <b>Computer Science</b> at Brown University as a member of the <a href="https://visual.cs.brown.edu/" target="_blank">Brown Visual Computing Group</a>. I am advised by Dr. Adriana Schulz and Dr. Daniel Ritchie.
  </p>
  <p>
     My research focus on the intersection of <b>computer graphics</b> and <b>apparel design</b>, with a focus on <b>computational fabrication</b>, <b>physical simulation</b>, <b>interactive geometric modeling</b>, and <b>human–computer interaction (HCI)</b>. I am interested in developing both computational methods and novel apparel design methodologies that expand creative possibilities and promote more sustainable design and manufacturing practices. Further details on my academic background and experience are available in my <a href="assets/CV_Yoo.pdf" target="_blank" rel="noopener noreferrer">CV</a>.
  <p>
  ❗️ Please note that this website is currently out of date. An update is coming soon!
  </p>   
